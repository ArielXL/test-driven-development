[pytest]
# ARNÉS DE PRUEBAS (test harness): pytest descubre, corre y reporta todo.
testpaths = tests
pythonpath = .
addopts = -v
# SUITES DE PRUEBAS (test suites): grupos que se pueden correr juntos.
#   pytest -m unitaria      pytest -m aceptacion      pytest -m regresion
markers =
    unitaria: pruebas unitarias (componentes individuales)
    aceptacion: pruebas de aceptación (escenarios del cliente)
    regresion: pruebas de regresión (defectos que no deben volver)
